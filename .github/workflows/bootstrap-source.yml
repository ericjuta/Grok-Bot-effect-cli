name: Bootstrap source snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Import verified source snapshot
        shell: bash
        run: |
          set -euo pipefail

          base_dir="$RUNNER_TEMP/grok-bot-base"
          patch_gz="$RUNNER_TEMP/source.patch.gz"

          git clone --filter=blob:none --no-checkout \
            https://github.com/b-nnett/grok-bot-0.18-reconstructed.git \
            "$base_dir"
          git -C "$base_dir" sparse-checkout init --no-cone
          git -C "$base_dir" sparse-checkout set --no-cone \
            '/*' \
            '!/research-archives/original/0.18.0/macos-arm64/Grok_Bot_0.18.0.dmg' \
            '!/research-archives/original/0.18.0/windows-x64/Grok_Bot_0.18.0_Setup.exe'
          git -C "$base_dir" checkout --detach \
            a9f633e09d49a85829b8236331b9e21f7e612634

          base64 --decode .bootstrap/source.patch.gz.b64 > "$patch_gz"
          echo "dbd62dfaef1330d8beab21b164f84fa5b87b421112331a29a9c5e59ac9308e68  $patch_gz" | sha256sum --check -

          rsync -a \
            --exclude='.git/' \
            "$base_dir/" ./
          gzip --decompress --stdout "$patch_gz" \
            | git apply --binary --whitespace=nowarn

          test ! -e research-archives/original/0.18.0/macos-arm64/Grok_Bot_0.18.0.dmg
          test ! -e research-archives/original/0.18.0/windows-x64/Grok_Bot_0.18.0_Setup.exe

          rm -f .bootstrap/source.patch.gz.b64
          rmdir .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "feat: add complete Effect TypeScript CLI"
          git push origin HEAD:main
